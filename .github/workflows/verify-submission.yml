name: Verify DRAgNEt Ledger Schema, Cross-Refs & Astro Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Schema, Cross-Ref, Sanitization & Reproducible Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator YAML parser
        run: pip install pyyaml

      - name: Run OCR & phonetic research harness self-tests
        run: python3 research-system/ocr_phonetic_harness.py --self-test

      - name: Validate JSON ledgers, cross-references, image rights & workspace sanitization
        run: python3 scripts/validate_submission.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Reproducible dependency install (npm ci)
        run: npm ci

      - name: Build Astro static site & 119 citation pages
        run: npx astro build
